name: Deploy contents-lab-api to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: contents-lab-api
  REGION: europe-west1
  GAR_LOCATION: europe-west1
  REPOSITORY: my-repository
  SERVICE_NAME: contents-lab-api
  JOB_NAME: contents-lab-migrate

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authentification Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/700861623270/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@contents-lab-api.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker Push
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 2. Build et Push de l'image
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      # 3. 🟢 EXÉCUTION ET VÉRIFICATION DES MIGRATIONS BDD
      - name: Run Database Migrations
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

          # Configuration ou mise à jour du Job Cloud Run
          gcloud run jobs deploy ${{ env.JOB_NAME }} \
            --image=$IMAGE_TAG \
            --region=${{ env.REGION }} \
            --command=python \
            --args=manage.py,migrate \
            --set-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars="CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DJANGO_SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --quiet

          # Exécution du Job et attente du résultat (--wait)
          gcloud run jobs execute ${{ env.JOB_NAME }} \
            --region=${{ env.REGION }} \
            --wait

      # 4. Déploiement de l'API (s'exécute uniquement si l'étape 3 réussit)
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DJANGO_SECRET_KEY=${{ secrets.SECRET_KEY }}
          flags: '--add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --allow-unauthenticated'

      - name: Show Service URL
        run: |
          echo "Deploiement reussi !"
          echo "URL du service : ${{ steps.deploy.outputs.url }}"
