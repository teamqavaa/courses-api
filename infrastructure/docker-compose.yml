# Piston code-execution sandbox, relocated from Digital-Readiness-Lab.
# The runtimes live in named volumes that predate this move; they are
# declared `external: true` with their original (project-scoped) names so
# all installed compilers survive the relocation without re-downloading.
services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    container_name: piston_api
    restart: always
    privileged: true
    environment:
      - PISTON_DISABLE_NETWORKING=false
      - PISTON_COMPILE_TIMEOUT=30000
      - PISTON_RUN_TIMEOUT=3000
    ports:
      - "2001:2000"
    volumes:
      - piston_data:/piston/data
      - piston_packages:/piston/packages

  cors-proxy:
    image: nginx:alpine
    container_name: piston_cors_proxy
    restart: always
    ports:
      - "2000:2000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - piston

volumes:
  piston_data:
    external: true
    name: infrastructure_piston_data
  piston_packages:
    external: true
    name: infrastructure_piston_packages
